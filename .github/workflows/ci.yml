name: CI
# Everything short of the board: check the designs and the proofs, compile the driver,
# run the simulation tests, simulate the emitted Verilog, build the bitstreams and
# simulate the synthesised netlists.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            extra-substituters = https://badlydrawnwizards.cachix.org
            extra-trusted-public-keys = badlydrawnwizards.cachix.org-1:TxG+RHY8RMC/AXc0LJbYtYm9LW/XRjfQwgz+EEaAjBI=
      # grail's job cache: the kernel proofs take about ten minutes the first time
      - uses: actions/cache@v4
        with:
          path: .grail
          key: grail-${{ hashFiles('flake.lock', 'grail.wiz', 'src/**', 'app/**', 'tests/**') }}
          restore-keys: grail-
      - name: Check the library and the proofs, compile the driver
        run: nix develop --command grail build
      - name: Simulation tests
        run: nix develop --command grail test
      - name: Generate, simulate, synthesise, simulate the netlists
        run: nix develop --command .grail/bin/icestick all
      - uses: actions/upload-artifact@v4
        with:
          name: bitstreams
          path: |
            build/*.bin
            build/*.v
            build/*.rpt
            build/*.log
            build/icestick.pcf
